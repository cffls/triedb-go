# cbindgen configuration for generating C headers
language = "C"
header = "/* Generated by cbindgen. Do not modify manually. */"
include_guard = "TRIEDB_H"
autogen_warning = "/* Warning: This file is auto-generated. Do not modify manually. */"
pragma_once = true
cpp_compat = true

[export]
include = ["TrieDB", "TrieDBTransaction", "TrieDBError"]

[export.rename]
"TrieDBError" = "triedb_error_t"
